[package]
name = "herdr-llm-lint"
version = "0.1.0"
edition = "2021"
description = "Lints CLAUDE.md, AGENTS.md, and other agent instruction files for stale paths, commands, facts, and drift"
license = "MIT"
repository = "https://github.com/shindakun/herdr-llm-lint"
readme = "README.md"
keywords = ["herdr", "lint", "claude-md", "agents-md", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["fixtures/"]

[dependencies]
globset = "0.4"
ignore = "0.4"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
lto = true
strip = true
